name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 编译 samples/ 下的每一个示例项目；任何一个失败（包括警告）都会让整个构建失败
  samples:
    name: 编译全部示例
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: dotnet build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=(samples/*/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::samples/ 下没有找到任何项目"
            exit 1
          fi
          failed=()
          for proj in "${projects[@]}"; do
            echo "::group::$proj"
            if ! dotnet build "$proj" --configuration Release -warnaserror --nologo; then
              failed+=("$proj")
              echo "::error file=$proj::编译失败"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '编译失败的示例：\n'; printf '  %s\n' "${failed[@]}"
            exit 1
          fi

      - name: 运行测试章节的集成测试
        shell: bash
        run: |
          set -euo pipefail
          for project in samples/*/Tests/*.csproj; do
            (cd "$(dirname "$project")" && dotnet test --project "$(basename "$project")" --configuration Release -p:TreatWarningsAsErrors=true)
          done

      - name: 验证容器发布与数据持久化
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish samples/23-deployment/Deployment.csproj --configuration Release --os linux --arch x64 /t:PublishContainer -p:TreatWarningsAsErrors=true
          bash samples/23-deployment/verify-container.sh

  docs:
    name: 构建文档站点
    needs: samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 页面上的"最后更新于"需要完整的 git 历史

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:site

      - run: npm run docs:check-translations

      - run: npm run docs:build

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
